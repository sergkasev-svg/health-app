name: Clinical V1 CI Gate

on:
  push:
    paths:
      - "backend/scripts/run_clinical_release_gate.py"
      - "backend/scripts/drift_debug_run.py"
      - "backend/tests/clinical/**"
      - ".github/workflows/clinical-v1-ci.yml"
  pull_request:
    paths:
      - "backend/scripts/run_clinical_release_gate.py"
      - "backend/scripts/drift_debug_run.py"
      - "backend/tests/clinical/**"
      - ".github/workflows/clinical-v1-ci.yml"

jobs:
  clinical-v1-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run drift debug pack
        run: python scripts/drift_debug_run.py

      - name: Run v1-ci release gate
        run: python scripts/run_clinical_release_gate.py --level v1-ci
